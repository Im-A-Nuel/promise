[workspace]
resolver = "2"
members = ["amplop", "tusdc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
near-workspaces = "=0.24.0"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
